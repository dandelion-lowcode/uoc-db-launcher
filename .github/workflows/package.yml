# Builds the application into a self-contained directory for each system a student may
# have, and attaches the four archives to a GitHub release.
#
# There is one job per system on purpose: jpackage cannot cross-build, so a Windows
# executable has to be produced on Windows and a macOS bundle on macOS. That is the one
# real constraint the tool imposes, and a build matrix is the answer to it.
#
# Nothing here is signed, because the course has no certificate. The archives are
# therefore plain directories rather than installers: an unsigned installer triggers the
# loudest warnings the system has and asks for administrator rights, and gives nothing
# back for either.

name: Package

on:
  push:
    tags:
      - "v*"
      # A tag written without the v builds too. One was pushed as "1.1.1", matched
      # nothing here, and built nothing: the release sat at the top of the page marked
      # Latest with not one file under it, which is what a student meets when they come
      # to download the thing. A release that quietly contains nothing is worse than no
      # release, and the difference was a character. The version is read below with the v
      # stripped, so either spelling produces the same archives.
      - "[0-9]*"
  workflow_dispatch:

env:
  APP_NAME: UOCDBLauncher
  MAIN_CLASS: com.uoc.Launcher
  JAVA_VERSION: "25"

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    strategy:
      # One system failing should not hide whether the others work.
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux-x64
          - os: windows-latest
            platform: windows-x64
          # Intel Macs and Apple Silicon need separate builds; a runtime is native code,
          # and an Apple Silicon build will not run on an Intel Mac at all. Both are kept
          # so that a student on an older Mac is not left out.
          #
          # The Intel runner is macos-15-intel: the macos-13 image it replaces no longer
          # picks up jobs, and a job asking for it waits without ever being given a
          # machine.
          - os: macos-15-intel
            platform: macos-x64
          - os: macos-14
            platform: macos-arm64

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: ${{ env.JAVA_VERSION }}

      # The tests run in test.yml, which the same tag triggers, containers and all. Here
      # they would run four times over, three of them on a machine with no Docker.
      - name: Build the jar and gather its dependencies
        shell: bash
        run: |
          mvn -B package -DskipTests
          mvn -B dependency:copy-dependencies \
            -DoutputDirectory=target/dist/libs -DincludeScope=runtime
          mkdir -p target/dist/input
          mv target/dist/libs/*.jar target/dist/input/
          cp target/uoc-db-launcher-*.jar target/dist/input/app.jar

      - name: Work out which parts of Java are actually used
        shell: bash
        run: |
          # Asking jdeps keeps the runtime correct as dependencies come and go, instead
          # of a hand-written list that silently rots into a crash on a student's machine.
          MODULES=$(jdeps --print-module-deps --ignore-missing-deps \
            --multi-release "$JAVA_VERSION" \
            --class-path "target/dist/input/*" target/classes)
          # jdeps reports what the bytecode references, so anything found by name at run
          # time has to be named here instead. Both of these are invisible to it:
          #
          #   jdk.localedata  without it the interface still translates, because those
          #                   texts are the application's own, but anything MessageFormat
          #                   renders falls back to English conventions. Costs 0.4 MB.
          #   jdk.zipfs       reading the bundled Docker files out of the application's
          #                   own jar needs it. Leaving it out builds and starts perfectly
          #                   well, then fails with "Provider jar not found" the moment a
          #                   student presses a play button.
          echo "JLINK_MODULES=$MODULES,jdk.localedata,jdk.zipfs" >> "$GITHUB_ENV"

      - name: Build a runtime holding only those parts
        shell: bash
        run: |
          jlink \
            --add-modules "$JLINK_MODULES" \
            --include-locales=en,es,ca \
            --strip-debug --no-header-files --no-man-pages --compress=zip-6 \
            --output target/dist/runtime

      # Every system wants the application's icon in its own format and jpackage rejects
      # anything else, so all three are kept in the repository ready to use. Nothing is
      # generated here: an icon changes about once in the life of a project, and building
      # it on every run would be a step that can fail for three artefacts that never move.
      #
      # A macOS build used to have none of this. The icon the application sets on its own
      # window is enough on Windows, but the Dock reads the bundle's icns and nothing
      # else, so the application arrived wearing the generic Java icon.
      - name: Choose the icon this system understands
        shell: bash
        run: |
          case "${{ runner.os }}" in
            macOS)   echo "ICON=src/main/packaging/icon.icns" >> "$GITHUB_ENV" ;;
            Windows) echo "ICON=src/main/packaging/icon.ico" >> "$GITHUB_ENV" ;;
            *)       echo "ICON=src/main/packaging/icon.png" >> "$GITHUB_ENV" ;;
          esac

      - name: Assemble the application
        shell: bash
        run: |
          # A tag is what a release is named after, so it decides the version and the
          # file names. Without this the archives were named after the POM, and v1.0.1
          # shipped four files all called 1.0.0.
          if [ "${{ github.ref_type }}" = "tag" ]; then
            RAW="${{ github.ref_name }}"
            RAW="${RAW#v}"
          else
            RAW=$(mvn -B -q help:evaluate -Dexpression=project.version -DforceStdout)
          fi
          # jpackage refuses a Maven version: it wants digits and dots, so "1.0-SNAPSHOT"
          # is rejected outright.
          VERSION=$(echo "$RAW" | sed 's/-SNAPSHOT//')
          case "$VERSION" in
            *.*.*) ;;
            *.*) VERSION="$VERSION.0" ;;
            *) VERSION="$VERSION.0.0" ;;
          esac
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"

          jpackage \
            --type app-image \
            --name "$APP_NAME" \
            --app-version "$VERSION" \
            --icon "$ICON" \
            --input target/dist/input \
            --main-jar app.jar \
            --main-class "$MAIN_CLASS" \
            --runtime-image target/dist/runtime \
            --dest target/dist/image \
            --java-options "--enable-native-access=ALL-UNNAMED"

      # Without the flag above, FlatLaf loading its native library prints four lines of
      # warnings before the window appears, and a future release of Java turns that from
      # a warning into a refusal to run.

      - name: Archive it
        shell: bash
        run: |
          NAME="uoc-db-launcher-$VERSION-${{ matrix.platform }}"
          mkdir -p target/release
          cd target/dist/image
          case "${{ runner.os }}" in
            macOS)
              # ditto, not zip: a .app is full of symlinks and permission bits that zip
              # flattens, and a flattened bundle will not launch.
              ditto -c -k --keepParent "$APP_NAME.app" "../../release/$NAME.zip"
              ;;
            Windows)
              powershell -NoProfile -Command \
                "Compress-Archive -Path '$APP_NAME' -DestinationPath '../../release/$NAME.zip' -Force"
              ;;
            *)
              tar czf "../../release/$NAME.tar.gz" "$APP_NAME"
              ;;
          esac

      - uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.platform }}
          path: target/release/*

  release:
    name: Publish the release
    needs: build
    runs-on: ubuntu-latest
    # Only a tag becomes a release; a manual run is for checking that the build still works.
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          path: artifacts
          merge-multiple: true

      - name: Attach every system's archive to the tag
        env:
          GH_TOKEN: ${{ github.token }}
        # A block scalar, not the default folded one. Without the pipe, YAML joins these
        # lines into a single string and the backslash survives as a literal argument,
        # which the shell then tries to expand as a filename and fails on.
        run: |
          gh release create "${{ github.ref_name }}" artifacts/* \
            --repo "${{ github.repository }}" --generate-notes
