# A query for each database and the answer it gives, shown in the trace while it is
# empty. They are not translated: a Cypher query is the same sentence in every language,
# and so is what the database answers.
#
# Every answer here was produced by running the query through the launcher itself against
# the pinned images, not written from memory. Re-run them if an image version changes.

# The first thing anyone types at a Mongo shell. What it prints is the size of each
# database beside its name, and only the names are promised here: the sizes move on their
# own, config alone having been seen at 12 KiB and at 148 KiB on an install nobody had
# written to.
mongo.query=show databases
mongo.result=admin\nconfig\nlocal

cassandra.query=DESCRIBE keyspaces;
cassandra.result=system       system_distributed  system_traces  system_virtual_schema\nsystem_auth  system_schema       system_views

# The empty Neo4j, which is where the course starts: the count is the point.
neo4j.query=MATCH (n) RETURN COUNT(n);
neo4j.result=COUNT(n)\n0

# The Twitter graph, where the same shape of query says what is actually in it.
neo4j-twitter.query=MATCH ()-[r]->() RETURN type(r), count(*);
neo4j-twitter.result="HAS_AS_PROFILE_LANGUAGE", 499\n"IS_WRITEN_FROM", 16339\n"FOLLOWS", 705345\n"HAS_WRITEN", 2644051\n"IS_A_RETWEET_OF", 1564319\n"IS_A_REPLY_OF", 577743

# Storing a value rather than pinging: Redis is a key-value store, and this is the whole
# of it in one line. The quotes are not needed around a number, and are there because a
# value with a space in it does need them.
redis.query=SET a "42"
redis.result=OK

# Storing a value here too, written the way the course notes write it: Riak has no shell,
# so the console runs curl, and -i is what shows the status line. Everything under it is
# left out of the example because one of the headers is the time of day and would never
# match twice.
riak.query=curl -i -XPUT http://localhost:8098/riak/prueba/a -H "Content-Type: text/plain" -d 42
riak.result=HTTP/1.1 204 No Content\n...

# The databases it comes with, which is also what says this console speaks SQL. The
# shell prints how long the query took underneath; that is left out, being different
# every time.
cockroachdb.query=SHOW DATABASES;
cockroachdb.result=defaultdb     | root  | NULL           | NULL             | {}      | NULL\npostgres      | root  | NULL           | NULL             | {}      | NULL\nsystem        | node  | NULL           | NULL             | {}      | NULL

# The first query of the module's tutorial, against the IMDB graph the image carries:
# 12,862 films, 50,134 people and 30 genres in imdb_vertices. LIMIT 1 because the whole
# collection is what the tutorial warns is capped at a thousand documents, and one is
# enough to show what a vertex holds.
#
# The answer is one long line of JSON, shown here in the parts that do not change. The
# missing one is _rev, which is written fresh every time the dataset is restored and so
# differs between one student's copy and the next.
arangodb.query=FOR v IN imdb_vertices LIMIT 1 RETURN v
arangodb.result=[{"_key":"345","_id":"imdb_vertices/345",\n...\n"label":"Avatar","description":"Disabled Marine Jake Sully travels to planet Pandora\n...\n"genre":"Action","title":"Avatar",\n...\n"type":"Movie","released":"2000-2010"}]

# VMart, the sample warehouse the image ships with. Naming its tables is more use than
# proving arithmetic works.
vertica.query=SELECT table_name FROM tables WHERE table_schema='public' ORDER BY table_name LIMIT 5;
vertica.result=customer_dimension\ndate_dimension\nemployee_dimension\ninventory_fact\nproduct_dimension

# Answered over HTTP, headers and all. The headers are left out of the example: one of
# them is the length of the body, which changes with it.
elasticsearch.query=GET /_cluster/health
elasticsearch.result=HTTP/1.1 200 OK\n...\n"cluster_name":"docker-cluster","status":"green"
