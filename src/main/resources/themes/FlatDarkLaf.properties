# The application's own colours, on the dark theme.
#
# These are read from UIManager like every other colour in the interface, because that is
# where a FlatLaf theme lives: registering this file as a custom defaults source merges it
# into the look and feel, so switching theme reloads it along with everything else and
# nothing has to be told about the change separately.
#
# FlatLaf itself has almost nothing to inherit here. It defines three semantic colours --
# error, warning and success -- and those are for the border of a text field. There is no
# palette of its own to extend, so these are our values; what UIManager buys is one place
# for them and one mechanism to reload them.

#---- the console palette ----
#
# Sixteen ANSI colours plus an orange, which ANSI does not have. Every one clears the
# WCAG AA contrast ratio against the console background it is painted on; see
# AnsiColorContrastTest, which measures them rather than trusting this comment.

Ansi.black = #bebebe
Ansi.red = #f9a497
Ansi.green = #8bd385
Ansi.yellow = #c3c55a
Ansi.blue = #a0bef9
Ansi.magenta = #eb9fe8
Ansi.cyan = #3ed6d6
Ansi.white = #f2f2f2
Ansi.brightBlack = #d4d4d4
Ansi.brightRed = #fbc5bd
Ansi.brightGreen = #a1ea9b
Ansi.brightYellow = #dadc71
Ansi.brightBlue = #c1d5fb
Ansi.brightMagenta = #fbbcf7
Ansi.brightCyan = #4fefee
Ansi.brightWhite = #ffffff
Ansi.orange = #f0a95a

#---- what a service is doing ----
#
# Twelve statuses, twelve colours, drawn from the palette above rather than chosen again,
# so the dot beside a service and the text in its console are the same set of colours.
#
# Four pairs sit close together on purpose. They are the pairs whose confusion costs
# nothing: stopped against stopping, starting against loading, unhealthy against
# restarting, failed against error. Mistaking either for the other still leaves the right
# idea, and the word beside the dot settles it.

Status.stopped = $Ansi.black
Status.stopping = $Ansi.brightBlack
Status.starting = $Ansi.cyan
Status.running = $Ansi.brightCyan
Status.installing = $Ansi.magenta
Status.paused = $Ansi.blue
Status.healthy = $Ansi.green
Status.unhealthy = $Ansi.yellow
Status.restarting = $Ansi.brightYellow
Status.crashed = $Ansi.red
Status.error = $Ansi.brightRed
Status.outOfMemory = $Ansi.orange

#---- the one button beside a service ----

Action.start = $Ansi.green
Action.stop = $Ansi.red
Action.unavailable = $Ansi.brightBlack

#---- text with no colour asked for: the theme's ordinary foreground ----
Ansi.default = $Ansi.white
