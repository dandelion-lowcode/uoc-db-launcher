# What holds for every theme. FlatLaf reads this file whichever look and feel is on,
# and the light and dark files beside it for what differs between the two.

#---- the tabs ----
#
# Less air to the left and right of a service's name than FlatLaf gives by default, which
# is 4,12,4,12. There are eleven tabs and the window is not always wide: what the extra
# eight pixels a tab bought was a scroll button appearing sooner. The vertical padding is
# left alone, since that is what sets the height of the whole row.
TabbedPane.tabInsets = 4,8,4,8
