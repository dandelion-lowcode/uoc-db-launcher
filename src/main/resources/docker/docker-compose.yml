# Versions are pinned rather than left at "latest" so the course keeps working. A student
# who starts these six months from now gets the same databases the exercises were written
# against, instead of a MongoDB or a Cassandra that has moved on and answers differently.
# Every version here is one the launcher has been run against.

# Without this, Compose names the project after the directory holding this file, and the
# network and any volume are named after the project. Moving this file, or renaming the
# folder a student unzipped, would silently leave their containers behind under the old
# name. The name is fixed here so it never depends on where the file sits.
name: uocdb

services:
  mongo:
    image: mongo:8.3.8
    container_name: uocdb-mongo
    ports:
      - "27017:27017"
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping')"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 20s

  cassandra:
    image: cassandra:5.0.9
    container_name: uocdb-cassandra
    ports:
      - "9042:9042"
    healthcheck:
      test: ["CMD-SHELL", "cqlsh -e 'describe keyspaces' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 60s

  neo4j:
    image: neo4j:2026.07.1
    container_name: uocdb-neo4j
    environment:
      - NEO4J_AUTH=none
    ports:
      - "7474:7474"
      - "7687:7687"
    healthcheck:
      test: ["CMD-SHELL", "wget -O /dev/null -q http://localhost:7474 || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  neo4j-twitter:
    # The dataset travels inside the image, so a student who deletes half the graph gets
    # it back by restarting the service, as with every other database here.
    #
    # Pulled rather than built. The graph is four million nodes, and expanding it takes
    # minutes on a laptop and a 336 MB file that cannot live in this repository; building
    # it once and publishing it costs a student a 0.54 GB download instead. The build
    # context lives outside this repository, and its README explains how to republish.
    image: ghcr.io/dandelion-lowcode/uocdb-neo4j-twitter:1.0
    container_name: uocdb-neo4j-twitter
    environment:
      - NEO4J_AUTH=none
    ports:
      - "17474:7474"
      - "17687:7687"
    healthcheck:
      # The web interface answers well before the graph can be queried, and the console
      # talks over Bolt, not HTTP. Asking the query engine itself is the only check that
      # means the console is usable.
      test: ["CMD-SHELL", "cypher-shell 'RETURN 1' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  redis:
    image: redis:8.10.1
    container_name: uocdb-redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  # Riak derives its Erlang node name from the container IP (riak@<ip>), and its
  # stored ring state is tied to that name. A new IP after a restart therefore makes
  # the node refuse to start. Pinning the address keeps the node name stable.
  riak:
    # Riak is covered in theory only, so what matters here is that a student can try the
    # requests from the notes without downloading a gigabyte for it. See the Dockerfile
    # for why the image Basho left behind is not used.
    build: ./riak
    container_name: uocdb-riak
    hostname: uocdb-riak
    networks:
      uocdb:
        # A fixed address keeps the node name stable across restarts, which is what Riak
        # names its ring after.
        ipv4_address: 172.28.0.10
    ports:
      - "8087:8087"
      - "8098:8098"
    healthcheck:
      # Stores a key over HTTP, which is the first thing the notes have a student do. A
      # read is not enough: watching a restart, this node answered 404 to everything for
      # a moment, then 500 "all_nodes_down" for seventeen seconds, and reads were still
      # answering 500 after writes had started working. A check that took "not found" for
      # an answer called the service ready in the first of those moments, and the console
      # then met the error the check had been written to catch.
      #
      # -f is what makes a 4xx or a 5xx a failure. "riak-admin test" is not used: it
      # writes to one fixed key and reports {error,locked} against its own previous run
      # every few seconds.
      test: ["CMD-SHELL", "curl -sf -o /dev/null -XPUT -H 'Content-Type: text/plain' -d ok http://localhost:8098/riak/healthcheck/probe"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  cockroachdb:
    image: cockroachdb/cockroach:v26.2.6
    container_name: uocdb-cockroachdb
    command: start-single-node --insecure
    ports:
      - "26257:26257"
      # The web console, moved off 8080. On a student's own machine that port belongs to
      # whatever they last built, and a service that refuses to start because something
      # else holds a port it does not even need is a bad first impression. Inside the
      # container it stays 8080, which is what the healthcheck below asks.
      - "18080:8080"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS 'http://localhost:8080/health?ready=1' > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  arangodb:
    # Carries the IMDB graph the module's tutorial works on, in a database called IMDB.
    # The tutorial's first query is FOR v IN imdb_vertices RETURN v, and until this image
    # existed there was nothing to answer it: the course's own 2024 setup downloaded the
    # same dataset and unzipped it at the root of the filesystem, where nothing ever
    # loaded it.
    #
    # Pulled rather than built, as neo4j-twitter is: the dataset is restored once, when
    # the volume is new, instead of 43 MB of JSON travelling inside every download.
    #
    # The volumes also keep the notebook's work: a student who spends an evening loading
    # Stack Overflow into it should not lose that the next time the service is recreated.
    # They are named after the dataset, so that a student who ran an earlier version gets
    # a new, empty volume and with it the restore; the old one stays on disk until they
    # remove it.
    image: ghcr.io/dandelion-lowcode/uocdb-arangodb-imdb:1.0
    container_name: uocdb-arangodb
    environment:
      ARANGO_ROOT_PASSWORD: rootpassword
    volumes:
      - arangodb_imdb_data:/var/lib/arangodb3
      - arangodb_imdb_apps_data:/var/lib/arangodb3-apps
    ports:
      - "8529:8529"
    healthcheck:
      # 127.0.0.1, not localhost. Inside this image localhost resolves to ::1 first and
      # arangod listens only on IPv4, so the check answered "connection refused" for a
      # server that was running perfectly and the service was never reported healthy.
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8529/_admin/server/availability"]
      interval: 10s
      timeout: 5s
      retries: 5
      # Longer than the others because the first start restores the dataset before the
      # server accepts anything, which is seconds on a fast disk and a good deal more on
      # a laptop that is also unpacking the image. Failures inside this window do not
      # count against the retries, so the cost of being generous is nothing.
      start_period: 120s

  vertica:
    image: josepmeseguer/vertica-ce:24.1.0-0
    platform: linux/amd64
    container_name: uocdb-vertica
    ports:
      - "5433:5433"
      - "5444:5444"
    healthcheck:
      # The full path: vsql is not on the PATH a healthcheck runs with, so as a bare name
      # this failed with "command not found" every time and the service was never once
      # reported healthy, however well it was running.
      #
      # It asks for the sample warehouse rather than SELECT 1, because the database
      # answers a good three seconds before the image has finished creating VMart's
      # tables in it. In that window the service was reported ready and every query about
      # the data a student has come here for answered "0 rows".
      test: ["CMD-SHELL", "/opt/vertica/bin/vsql -X -h localhost -U dbadmin -d VMart -tAc \"SELECT count(*) FROM tables WHERE table_schema='public'\" | grep -qv '^0$'"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.13.4
    container_name: uocdb-elasticsearch
    environment:
      discovery.type: single-node
      xpack.security.enabled: "false"
      ES_JAVA_OPTS: -Xms512m -Xmx512m
    ports:
      - "9200:9200"
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://localhost:9200/_cluster/health > /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  jupyter:
    build:
      context: ./jupyter
    image: uocdb-jupyter:latest
    container_name: uocdb-jupyter
    ports:
      - "8888:8888"
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      # Which notebooks the student works on. Compose resolves a relative path against
      # the directory holding this file, and the launcher always unpacks this file and
      # the notebooks side by side, so one path is right both when the application runs
      # from source and when it runs from an installed copy.
      - ${UOCDB_NOTEBOOKS:-../notebooks}:/home/jovyan/work/notebooks
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8888/tree', timeout=3)"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

volumes:
  # ArangoDB alone keeps its data across a recreate, because half of it is the student's:
  # the image brings IMDB, the notebook builds Stack Overflow on top of it.
  arangodb_imdb_data:
  arangodb_imdb_apps_data:

networks:
  uocdb:
    ipam:
      config:
        - subnet: 172.28.0.0/16
